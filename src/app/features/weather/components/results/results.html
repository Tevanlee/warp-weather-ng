@if (weather; as w) {
  <app-card>
    <div class="flex flex-col items-center relative">
      <div class="flex items-center gap-2">
        <lucide-icon [img]="NavigationIcon" [size]="12" />
        <app-text class="body-sm">{{ w.city }}</app-text>
      </div>
      <img
        class="w-auto h-20"
        [src]="'https://openweathermap.org/img/wn/' + w.icon + '@2x.png'"
        alt="Weather icon"
      />
      <div class="details flex flex-col items-center gap-4">
        <div class="temp flex gap-2">
          <app-text class="display">{{ `${w.temperature}°C` }}</app-text>
        </div>
        <div class="flex items-center justify-center gap-3">
          <app-text class="body capitalize">{{ w.description }}</app-text>
        </div>
        <div class="pilGroup border p-1 rounded-lg flex items-center justify-between gap-1 w-full">
          <div class="pil flex items-center justify-center gap-3 py-2 px-4 rounded">
            <app-text class="flex items-center gap-1 body-sm">
              <lucide-icon [img]="WindIcon" [size]="16" />
              {{ `Wind: ${w.wind}` }}
            </app-text>
            <app-text class="flex items-center gap-1 body-sm">
              <lucide-icon [img]="HumIcon" [size]="16" />
              {{ `Hum: ${w.humidity}` }}
            </app-text>
          </div>
        </div>
      </div>
    </div>
  </app-card>
}

@if (error) {
  <app-error [value]="error.message" />
}
